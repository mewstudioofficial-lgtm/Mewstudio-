<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0" />
    </radialGradient>
    <filter id="neon" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="128" fill="url(#bg)" />

  <!-- Outer Tech Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#0284c7" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="12 8" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.6" />

  <!-- Glow Core -->
  <circle cx="256" cy="256" r="130" fill="url(#coreGlow)" />

  <!-- Baymax Head / Helmet Outline (Sleek minimalist Jarvis style) -->
  <ellipse cx="256" cy="245" rx="90" ry="68" fill="#0f172a" stroke="#38bdf8" stroke-width="4" filter="url(#neon)" />

  <!-- Baymax Signature Two Eyes & Connecting Line -->
  <circle cx="206" cy="245" r="16" fill="#38bdf8" filter="url(#neon)" />
  <circle cx="306" cy="245" r="16" fill="#38bdf8" filter="url(#neon)" />
  <line x1="206" y1="245" x2="306" y2="245" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" filter="url(#neon)" />

  <!-- Arc Reactor Center Pulse -->
  <circle cx="256" cy="380" r="26" fill="none" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.8" />
  <circle cx="256" cy="380" r="12" fill="#38bdf8" filter="url(#neon)" />
  <line x1="256" y1="313" x2="256" y2="354" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="4 4" />

  <!-- HUD markers -->
  <path d="M 140 160 L 120 160 L 120 180" fill="none" stroke="#0ea5e9" stroke-width="3" stroke-linecap="round" />
  <path d="M 372 160 L 392 160 L 392 180" fill="none" stroke="#0ea5e9" stroke-width="3" stroke-linecap="round" />
  <path d="M 140 420 L 120 420 L 120 400" fill="none" stroke="#0ea5e9" stroke-width="3" stroke-linecap="round" />
  <path d="M 372 420 L 392 420 L 392 400" fill="none" stroke="#0ea5e9" stroke-width="3" stroke-linecap="round" />
</svg>
